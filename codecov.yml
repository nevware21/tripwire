codecov:
  notify:
    require_ci_to_pass: yes
    
comment:
  layout: "header, changes, diff, files"
  behavior: default

coverage:
  status:
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto
        branches:
          - main
        paths:
          - core/src
          - shim/chai/src
          - internal/runner/src
    project:
      core:
        paths:
          - core/src
        target: 80%
        flags:
          - core
      chai_shim:
        paths:
          - shim/chai/src
        target: 70%
        flags:
          - chai_shim
      # runner/ was outside coverage measurement entirely until the runner flag was
      # added. The target is a floor set just under the first measured value (32.4%
      # lines) rather than an aspiration -- raise it as execute/, ux/, codecov/,
      # compile/ and client/ gain tests, and do not lower it.
      #
      # The figure is low partly because it is honest: ux/browser and assets are
      # browser-side code that the node test process cannot execute, and they are
      # deliberately left in the denominator rather than excluded, so the number
      # reflects what is actually untested rather than what is conveniently
      # measurable.
      runner:
        paths:
          - internal/runner/src
        target: 30%
        flags:
          - runner

flags:
  core:
    paths:
      - core/src

  chai_shim:
    paths:
      - shim/chai/src

  runner:
    paths:
      - internal/runner/src
