<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.ico" />
  <title>__RUNNER_TITLE__</title>
  <style>
__RUNNER_CSS__
  </style>
</head>
<body>
  <div class="shell">
    <h1>__RUNNER_TITLE__</h1>
    <p>__RUNNER_DESCRIPTION__</p>
    <div class="controls">
      <select id="suiteSelect" title="Suite Filter"></select>
      <select id="testSelect" title="Test Filter"></select>
      <button id="runBtn">Run</button>
      <button id="finishBtn" class="ghost" disabled>Finish</button>
      <button id="clearLogsBtn" class="ghost">Clear Logs</button>
      <button id="clearResultsBtn" class="ghost">Clear Results</button>
    </div>
    <div class="row">
      <span id="status">Initializing...</span>
    </div>
    <div class="layout">
      <section class="panel">
        <div class="panel-head"><span>Runner Log</span><span>Suite/Test level on CLI</span></div>
        <div id="logs"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><span>Assertions</span><span id="assertCount">0 assertions</span></div>
        <div id="results"></div>
      </section>
    </div>
  </div>
  <script src="__RUNNER_SCRIPT_URL__" defer></script>
</body>
</html>
